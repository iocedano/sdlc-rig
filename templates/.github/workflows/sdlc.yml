name: SDLC review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sdlc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sdlc:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # anthropic | cursor | codex | gemini | copilot  (set the matching secret below)
      SDLC_ENGINE: ${{ vars.SDLC_ENGINE || 'anthropic' }}
      SDLC_MODEL: ${{ vars.SDLC_MODEL }}
      SDLC_COMPLIANCE: ${{ vars.SDLC_COMPLIANCE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Cursor CLI
        if: env.SDLC_ENGINE == 'cursor'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run SDLC checks
        id: sdlc
        continue-on-error: true
        run: npx sdlc pr --base "origin/${{ github.base_ref }}" --fail-on critical > /dev/null

      - name: Comment on PR
        if: always() && hashFiles('.sdlc/reports/pr.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file .sdlc/reports/pr.md \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file .sdlc/reports/pr.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdlc-reports
          path: .sdlc/reports/

      - name: Gate
        if: steps.sdlc.outcome == 'failure'
        run: |
          echo "::error::SDLC checks found critical issues or failing tests. See the PR comment."
          exit 1
